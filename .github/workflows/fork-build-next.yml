name: fork-build-next

# 在自己的 fork 上手动触发，产出【未签名未公证】的 DSH NEXT (dsh-desktop-next) macOS dmg。
#
# 为什么不能照抄上游 CI：
#   1. 上游 ci.yml 的打包矩阵只有 dsh-plugin-desktop / dsh-plugin-desktop-beta，
#      Next 从未被打包过，只在 CI 里跑 verify:* 验证。
#   2. Next 的 package.ts 复用 beta 的实现，dist:mac-smoke 内部的前置门禁被硬编码
#      成 dsh-plugin-desktop-beta 的 check:mac-package，对 Next 没有意义，
#      所以这里用 DSH_PACKAGE_CHECK_ALREADY_RAN=1 跳过，改由本 workflow 自己跑
#      Next 的 build / typecheck / test 门禁。
#   3. dist:mac-smoke 只负责打 dmg，不会 build，所以 Next 和 community market
#      都必须先显式 build。
#   4. 故意不跑 root 的 market:prepare / aa:prepare-release：前者会把 dshmarket
#      强行追到 npm latest 并改写 lockfile，后者会去 clone Agents Anywhere 主分支
#      重新打包；fork 构建用仓库里已提交的 vendor tgz 就够了。
#
# 触发：Actions → fork-build-next → Run workflow → 选 arch
#   arm64     : Apple Silicon 专用（M 系 Mac 用这个），体积最小
#   x64       : Intel 专用
#   universal : 双架构合一，Intel/Apple Silicon 都能跑，但体积几乎翻倍
#
# 产物：Actions run 页面底部的 Artifacts（14 天保留），未签名，首次打开需右键“打开”。

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'macOS 架构（arm64 = Apple Silicon，体积最小）'
        type: choice
        required: true
        default: arm64
        options:
          - arm64
          - x64
          - universal

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  macos-next:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2

      - run: corepack enable

      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

      - run: yarn install --immutable

      - name: Build community market
        run: yarn workspace dsh-community-market build

      - name: Gate: build, typecheck and unit tests for Next
        run: |
          yarn workspace dsh-desktop-next build
          yarn workspace dsh-desktop-next typecheck
          yarn workspace dsh-desktop-next test

      - name: Build macOS DMG (unsigned, ${{ inputs.arch }})
        env:
          # 跳过 dist:mac-smoke 内置的 beta 门禁（见文件头说明 2）
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_MAC_SMOKE_ARCH: ${{ inputs.arch }}
        run: yarn workspace dsh-desktop-next dist:mac-smoke

      - name: List built artifacts
        run: ls -lh dsh-desktop-next/dist/mac-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-next-2.0.14-macos-${{ inputs.arch }}-unsigned
          path: dsh-desktop-next/dist/mac-smoke/**/*.dmg
          if-no-files-found: error
          retention-days: 14
