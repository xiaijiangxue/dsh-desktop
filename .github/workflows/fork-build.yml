name: fork-build

# 在自己的 fork 上手动触发，产出【未签名未公证】的 macOS dmg。
# 命令完全对齐上游 anywhere-labs/dsh-desktop 的 ci.yml → desktop-macos job
# （上游 CI 已验证过这条路径；dist:mac 是签名发行路径，fork 里用不了也不该用）。
#
# 触发：Actions → fork-build → Run workflow → 选 arch
#   arm64     : Apple Silicon 专用，体积最小（M 系 Mac 用这个）
#   x64       : Intel 专用
#   universal : 双架构合一，Intel/Apple Silicon 都能跑，但体积几乎翻倍
#
# 为什么 universal 大这么多：dsh 0.1.7-rc.1 引入了 LibreOffice
# （@deepseek-ai/libreoffice-kit-darwin-x64 = 269MB、-arm64 = 201MB），
# universal 包会同时带上两份；官方 2.0.13 用的 0.1.5-rc.2 里还没有这个包，
# 所以官方那个 319MB 跟构建方式无关，只是 dsh 版本更老。
#
# 想加 Windows / Linux，复制下面这个 job，把三条命令换成：
#   Windows: yarn workspace dsh-plugin-desktop check:win-package:platform
#            yarn workspace dsh-plugin-desktop dist:win          (env DSH_WINDOWS_PACKAGE_COMPRESSION=store)
#            yarn workspace dsh-plugin-desktop dist:win-portable
#   Linux:   yarn workspace dsh-plugin-desktop check:linux-package:platform
#            yarn workspace dsh-plugin-desktop dist:linux

on:
  # 只留手动触发，避免 push 时被自己的 commit 顺带跑一次
  workflow_dispatch:
    inputs:
      arch:
        description: 'macOS 架构（arm64 = Apple Silicon，体积最小）'
        type: choice
        required: true
        default: arm64
        options:
          - arm64
          - x64
          - universal

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2

      - run: corepack enable

      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

      - run: yarn install --immutable

      # 与上游 CI 一致：先跑打包门禁（会跑一批 package/mac 相关 vitest）
      - name: Packaging gate
        run: yarn workspace dsh-plugin-desktop check:mac-package:platform

      - name: Build macOS DMG (unsigned, ${{ inputs.arch }})
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_MAC_SMOKE_ARCH: ${{ inputs.arch }}
        run: yarn workspace dsh-plugin-desktop dist:mac-smoke

      - name: List built artifacts
        run: ls -lh dsh-plugin-desktop/dist/mac-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-2.0.14-macos-${{ inputs.arch }}-unsigned
          path: dsh-plugin-desktop/dist/mac-smoke/**/*.dmg
          if-no-files-found: error
          retention-days: 14
